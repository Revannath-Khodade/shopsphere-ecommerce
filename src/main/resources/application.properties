# =====================================================================
# ShopSphere Backend - application.properties
# Phase 1: Foundation configuration
# =====================================================================

# ------------------- Application -------------------
spring.application.name=shopsphere-backend
server.port=8080
server.servlet.context-path=/api

# ------------------- MySQL DataSource -------------------
spring.datasource.url=jdbc:mysql://localhost:3306/shopsphere_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------- HikariCP Connection Pool -------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=ShopSphereHikariPool

# ------------------- JPA / Hibernate -------------------
# ddl-auto = validate in real production; "update" is convenient for early Phase 1 development.
# Since we ship our own schema.sql, "validate" is the recommended safe setting once schema is applied.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ------------------- SQL Initialization -------------------
# We manage schema/data manually via src/main/resources/db/schema.sql and insert.sql
# (run manually against MySQL, or point Spring at them explicitly below if desired).
spring.sql.init.mode=never
# spring.sql.init.schema-locations=classpath:db/schema.sql
# spring.sql.init.data-locations=classpath:db/insert.sql

# ------------------- Logging -------------------
logging.level.root=INFO
logging.level.com.shopsphere=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %5p - %logger{36} - %msg%n

# ------------------- Jackson -------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ------------------- JWT (Phase 3: Spring Security + JWT) -------------------
# IMPORTANT: replace with a securely generated, >=256-bit random secret before
# production (e.g. `openssl rand -base64 64`). Never commit a real secret.
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_BASE64_SECRET_BEFORE_PRODUCTION
# Access token lifetime: 15 minutes - short-lived by design, refreshed via /api/auth/refresh-token.
app.jwt.expiration-ms=900000
# Refresh token lifetime: 7 days.
app.jwt.refresh-expiration-ms=604800000

# ------------------- Security -------------------
# Comma-separated list of allowed CORS origin patterns for the React frontend.
app.security.cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://*.shopsphere.com

# ------------------- OpenAPI / Swagger -------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ------------------- Multipart (product image uploads, future phase) -------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
